[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentica-core"
version = "0.3.0"
description = "Local-first runtime for agentic chat, voice, and parallel local, SSH, or SLURM jobs."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "agentica-core" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# agentic-loop is unpublished -> install it editable from the sibling checkout:
#   pip install -e ../AgenticLocal
# agentica_core also falls back to adding ../AgenticLocal to sys.path at import
# time so the dev layout works without an explicit install.
dependencies = [
  "PyYAML>=6",
  "websockets>=12",  # voice gateway (full-duplex WS for the local voice engine)
]

[project.optional-dependencies]
# Local open-weight speech: Whisper (STT, CTranslate2) + Kokoro (natural TTS,
# onnxruntime). Heavy wheels + models, provisioned on first voice use rather than
# shipped in the ~110MB app bundle. Piper (lighter TTS fallback) is a native
# binary fetched at runtime by voice_provision, not a Python dependency.
voice = [
  "faster-whisper>=1.0",
  # Apple-Silicon GPU STT: same-latency small.en beats CPU base.en on accuracy
  # (see voice_provision; AGENTICA_STT_ENGINE overrides the auto-pick).
  "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "kokoro-onnx>=0.4",
  "soundfile>=0.12",
]

[project.scripts]
agentica = "agentica_core.cli:main"
slurm-agentic = "agentica_core.cli:main"  # back-compat alias

[tool.setuptools.packages.find]
include = ["agentica_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
