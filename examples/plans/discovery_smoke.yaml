# Minimal real-cluster smoke task: prove the full submit -> sbatch -> on-node
# Planner/Executor/Auditor -> deterministic backstop pipeline works on Discovery.
title: hello from Discovery
kind: code
goal: >
  Use the write_file tool to create a file named hello.txt in the workspace whose
  entire content is exactly the line: hello from discovery
workspace: ./ws_discovery        # created fresh on the node if absent
checklist:
  - "hello.txt exists and contains exactly 'hello from discovery'"
success_criteria:
  tests: "grep -qx 'hello from discovery' hello.txt"
  artifacts: ["hello.txt"]
max_iterations: 2
max_steps_per_iteration: 6
